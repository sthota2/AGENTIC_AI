name: Jira Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -n "$JIRA_USERNAME" ] && [ -n "$JIRA_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose Jira access
        if: steps.creds.outputs.enabled == 'true'
        env:
          JIRA_URL: https://tsandyk8s.atlassian.net
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          auth=(-s -u "$JIRA_USERNAME:$JIRA_API_TOKEN")
          echo "=== /myself ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/myself" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ["accountId","displayName","emailAddress","active"]})'

          echo "=== /project/SOFT (style + roles) ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/project/SOFT" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ["id","key","name","style","simplified","projectTypeKey"]}); print("roles:", d.get("roles"))'

          echo "=== /project/SOFT/role (role -> actors) ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/project/SOFT/role" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin), indent=2)[:2000])'

          echo "=== /mypermissions?projectKey=SOFT ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/mypermissions?projectKey=SOFT&permissions=ADD_COMMENTS,BROWSE_PROJECTS,ADMINISTER_PROJECTS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps({k:v.get("havePermission") for k,v in d.get("permissions",{}).items()}, indent=2))'

          echo "=== /issue/SOFT-1 (fields) ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/SOFT-1?fields=summary,status,project" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get("fields",d), indent=2)[:1000])'

          echo "=== /project/SOFT/role/10020 (Administrator actors) ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/project/SOFT/role/10020" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("actors:", [ (a.get("type"), a.get("displayName") or a.get("name")) for a in d.get("actors",[])])'

          echo "=== POST comment v3 (raw) ==="
          curl -s -w "\nHTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "$JIRA_URL/rest/api/3/issue/SOFT-1/comment" \
            -d '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"diagnostic comment v3"}]}]}}' | tail -5

          echo "=== POST comment v2 (raw) ==="
          curl -s -w "\nHTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "$JIRA_URL/rest/api/2/issue/SOFT-1/comment" \
            -d '{"body":"diagnostic comment v2"}' | tail -5

          echo "=== cloudId ==="
          CLOUD_ID=$(curl -s "$JIRA_URL/_edge/tenant_info" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("cloudId",""))')
          echo "cloudId=$CLOUD_ID"

          echo "=== POST comment via gateway (scoped-token path) ==="
          curl -s -w "\nHTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "https://api.atlassian.com/ex/jira/$CLOUD_ID/rest/api/3/issue/SOFT-1/comment" \
            -d '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"diagnostic gateway comment"}]}]}}' | tail -5

          echo "=== /mypermissions?issueKey=SOFT-1 ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/mypermissions?issueKey=SOFT-1&permissions=ADD_COMMENTS,BROWSE_PROJECTS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps({k:v.get("havePermission") for k,v in d.get("permissions",{}).items()}, indent=2))'

          echo "=== /issue/SOFT-1 (security/type/reporter) ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/SOFT-1?fields=security,issuetype,reporter,creator,labels" | python3 -c 'import sys,json; d=json.load(sys.stdin); f=d.get("fields",d); print({"security":f.get("security"),"issuetype":(f.get("issuetype") or {}).get("name"),"reporter":(f.get("reporter") or {}).get("displayName"),"creator":(f.get("creator") or {}).get("displayName"),"labels":f.get("labels")})'

          echo "=== compare status SOFT-1 vs SOFT-2 ==="
          for K in SOFT-1 SOFT-2; do
            curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/$K?fields=status,issuetype,project" | python3 -c 'import sys,json; d=json.load(sys.stdin); s=d.get("fields",{}).get("status",{}); print(d.get("key"), "status=",s.get("name"), "statusId=",s.get("id"), "cat=",(s.get("statusCategory") or {}).get("key"))'
          done

          echo "=== /mypermissions?issueKey=SOFT-2 ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/mypermissions?issueKey=SOFT-2&permissions=ADD_COMMENTS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps({k:v.get("havePermission") for k,v in d.get("permissions",{}).items()}))'

          echo "=== issuerestriction SOFT-1 vs SOFT-2 ==="
          for K in SOFT-1 SOFT-2; do
            echo "-- $K issue restrictions --"
            curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/$K?fields=issuerestriction" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get("fields",{}).get("issuerestriction")))'
            echo "-- $K entity properties --"
            curl -s -w " [HTTP %{http_code}]\n" "${auth[@]}" "$JIRA_URL/rest/api/3/issue/$K/properties"
          done

          echo "=== project type ==="
          curl "${auth[@]}" "$JIRA_URL/rest/api/3/project/SOFT" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ["id","key","style","simplified","projectTypeKey"]})'

          echo "=== issuetype id/name SOFT-1 vs SOFT-2 ==="
          for K in SOFT-1 SOFT-2; do
            curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/$K?fields=issuetype" | python3 -c 'import sys,json; d=json.load(sys.stdin); t=d.get("fields",{}).get("issuetype",{}); print(d.get("key"),"type id=",t.get("id"),"name=",t.get("name"),"subtask=",t.get("subtask"))'
          done

          echo "=== JSM request probe ==="
          for K in SOFT-1 SOFT-2; do
            echo -n "$K servicedeskapi: "; curl -s -o /dev/null -w "HTTP %{http_code}\n" "${auth[@]}" "$JIRA_URL/rest/servicedeskapi/request/$K"
          done

          echo "=== PUT edit SOFT-1 (test edit permission) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
            -X PUT "$JIRA_URL/rest/api/3/issue/SOFT-1" -d '{"fields":{"summary":"SOFT-1 diag"}}'

          echo "=== re-POST comment SOFT-1 ==="
          curl -s -w "\nHTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "$JIRA_URL/rest/api/3/issue/SOFT-1/comment" \
            -d '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"retry comment"}]}]}}' | tail -3

          echo "=== SOFT-1/SOFT-2 internal ids ==="
          for K in SOFT-1 SOFT-2; do
            curl "${auth[@]}" "$JIRA_URL/rest/api/3/issue/$K?fields=id" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("key"), d.get("id"))'
          done

          echo "=== archived issues (Archive API) ==="
          curl -s -w "\n[HTTP %{http_code}]\n" "${auth[@]}" "$JIRA_URL/rest/api/3/issue/archive?maxResults=1000" | python3 -c 'import sys,json; t=sys.stdin.read(); print(t[:1500])'

          echo "=== full permission diff SOFT-1 vs SOFT-2 ==="
          for K in SOFT-1 SOFT-2; do
            curl "${auth[@]}" "$JIRA_URL/rest/api/3/mypermissions?issueKey=$K" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("'$K'", json.dumps({k:v.get("havePermission") for k,v in sorted(d.get("permissions",{}).items())}, indent=0))' > /tmp/perm_$K.txt
          done
          echo "-- SOFT-1 --"; cat /tmp/perm_SOFT-1.txt
          echo "-- diff (only lines differing) --"
          diff /tmp/perm_SOFT-1.txt /tmp/perm_SOFT-2.txt || true

          echo "=== create+comment new issue ==="
          NEW=$(curl -s "${auth[@]}" -H "Content-Type: application/json" -X POST "$JIRA_URL/rest/api/3/issue" \
            -d '{"fields":{"project":{"key":"SOFT"},"summary":"diag issue for comment test","issuetype":{"name":"Task"}}}' | python3 -c 'import sys,json; print(json.load(sys.stdin).get("key",""))')
          echo "new issue: $NEW"
          if [ -n "$NEW" ]; then
            curl -s -w "\nHTTP %{http_code}\n" "${auth[@]}" -H "Content-Type: application/json" \
              -X POST "$JIRA_URL/rest/api/3/issue/$NEW/comment" \
              -d '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"diag comment on new issue"}]}]}}' | tail -3
          fi
