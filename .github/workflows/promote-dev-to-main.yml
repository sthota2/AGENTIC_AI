name: Promote Dev to Main

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  promote-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "sthota2"
          git config user.email "sthota2@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git fetch origin dev
          git merge origin/dev --no-edit
          git push origin main
